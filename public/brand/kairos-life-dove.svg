<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="Kairos Life dove">
  <!-- Kairos Life mark: a cartoon dove with raised wings carrying an olive branch,
       drawn from the church's dove line-art. Thick ink outline, soft shading. -->
  <defs>
    <linearGradient id="kl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="kl-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdcff"/>
    </linearGradient>
    <radialGradient id="kl-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a6"/><stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="180" r="170" fill="url(#kl-glow)"/>
  <g stroke="#1d1533" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- back (right) wing, raised -->
    <path d="M222 150 C 250 70, 300 30, 352 28 C 340 52, 352 64, 338 82 C 352 92, 340 110, 322 118 C 334 132, 316 148, 292 152 C 276 170, 248 172, 222 166 Z" fill="url(#kl-wing)"/>
    <path d="M300 60 C 284 82, 270 104, 254 128 M326 92 C 304 108, 284 124, 262 140" fill="none" stroke-width="5" opacity=".35"/>
    <!-- tail feathers flowing down -->
    <path d="M168 238 C 150 280, 152 318, 170 352 C 182 334, 192 342, 200 358 C 208 340, 220 340, 232 352 C 244 320, 240 282, 222 242 Z" fill="url(#kl-body)"/>
    <path d="M188 262 L184 330 M206 266 L208 334" fill="none" stroke-width="5" opacity=".3"/>
    <!-- body -->
    <path d="M126 150 C 120 120, 146 96, 176 102 C 204 108, 226 132, 236 168 C 246 206, 236 244, 204 254 C 172 262, 148 240, 142 210 C 138 190, 132 172, 126 150 Z" fill="url(#kl-body)"/>
    <!-- front (left) wing, raised high -->
    <path d="M168 170 C 132 140, 92 92, 54 40 C 82 44, 92 58, 102 50 C 116 62, 120 74, 136 68 C 144 86, 152 92, 168 92 C 176 112, 188 128, 204 140 C 198 160, 186 172, 168 170 Z" fill="url(#kl-wing)"/>
    <path d="M84 62 C 108 96, 132 124, 160 150 M120 80 C 138 106, 158 128, 182 144" fill="none" stroke-width="5" opacity=".35"/>
    <!-- head -->
    <circle cx="118" cy="152" r="33" fill="#ffffff"/>
    <!-- beak -->
    <path d="M92 144 L48 160 L94 174 Z" fill="#f5b83d"/>
    <!-- olive branch in the beak -->
    <path d="M30 196 C 48 182, 62 170, 76 164" fill="none" stroke="#3d6b2b" stroke-width="7"/>
  </g>
  <!-- olive leaves -->
  <g stroke="#1d1533" stroke-width="5" stroke-linejoin="round">
    <path d="M44 186 C 30 170, 34 156, 50 156 C 54 170, 52 180, 44 186 Z" fill="#7fbf4d"/>
    <path d="M58 178 C 66 194, 62 206, 50 204 C 48 192, 50 184, 58 178 Z" fill="#9ad15f"/>
    <path d="M32 196 C 14 200, 8 214, 16 222 C 30 216, 36 206, 32 196 Z" fill="#7fbf4d"/>
    <circle cx="66" cy="192" r="6.5" fill="#5b8f3a"/>
  </g>
  <!-- face: big cartoon eye with a shine, rosy cheek -->
  <circle cx="114" cy="144" r="7.5" fill="#1d1533"/>
  <circle cx="117" cy="141" r="2.8" fill="#ffffff"/>
  <ellipse cx="128" cy="162" rx="8" ry="4.5" fill="#ff9fb1" opacity=".75"/>
  <!-- sparkles -->
  <g fill="#f5c518" stroke="#1d1533" stroke-width="3" stroke-linejoin="round">
    <path d="M326 186 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
    <path d="M60 230 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
    <path d="M300 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
  </g>
</svg>
