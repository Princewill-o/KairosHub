<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kairos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="assets/icons/Books.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#342a49" />
    <title>Kairos — Little adventures. Lasting wisdom.</title>
    <meta
      name="description"
      content="Eighteen Bible-inspired adventures. Catch animals, race the desert, fish, play together and explore Scripture. Guest play, four explorers, and offline arcade games."
    />
    <link rel="icon" href="assets/icons/Books.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="intro.css" />
    <link rel="stylesheet" href="arcade.css" />
    <link rel="stylesheet" href="mobile.css" />
    <link rel="preload" as="image" href="assets/intro/poster.webp" />
  </head>
  <body class="intro-active">
    <div id="site-intro" data-state="poster" role="dialog" aria-modal="true" aria-label="Welcome to Kairos Games">
      <button id="intro-start" aria-label="Press anywhere to start the Kairos Games intro">
        <img src="assets/intro/poster.webp" alt="Kairos Games. Press anywhere to start." fetchpriority="high" />
      </button>
      <video id="intro-video" data-src="assets/intro/intro.mp4" playsinline preload="none" aria-label="Kairos Games opening animation"></video>
      <button id="intro-skip" type="button">Skip intro</button>
      <p id="intro-status" role="status" aria-live="polite" hidden></p>
    </div>
    <div id="app" inert></div>
    <script type="module" src="intro.mjs"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
